[package]
name = "srg-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Live SoulAuth integration suite: authenticate an AI actor against a running SoulAuth, read its authentication fact, and turn it into a VerifiedActorFact"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap.workspace = true
sha2.workspace = true
srg-core = { path = "../srg-core" }
srg-soulauth = { path = "../srg-soulauth" }
ureq = { version = "2.10", features = ["json"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"
hex = "0.4"
