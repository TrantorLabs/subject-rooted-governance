[workspace]
members = [
    "crates/srg-core",
    "crates/srg-harness",
    "crates/srg-explorer",
    "crates/srg-soulauth",
    "crates/srg-live",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["TRANTOR LABS"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
overflow-checks = true
